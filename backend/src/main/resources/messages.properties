## 필드별 검증 메시지 ({0}은 필드명, {1}, {2}는 어노테이션의 설정값)
#NotBlank={0}은(는) 필수입니다.
#NotNull={0}은(는) 필수입니다.
#Min={0}은(는) 최소 {1} 이상이어야 합니다.
#Max={0}은(는) 최대 {1}까지 가능합니다.
#Size.min={0}은(는) 최소 {2}자 이상이어야 합니다.
#Size.max={0}은(는) 최대 {1}자 이하이어야 합니다.
#Size.range={0}은(는) {2}자에서 {1}자 사이여야 합니다.
#Positive={0}은(는) 양수여야 합니다.
